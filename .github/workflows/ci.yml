name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:generate
      - run: git diff --exit-code -- docs/SETTINGS.md docs/KEYBINDINGS.md examples/config.toml
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:deps
      - run: npx playwright install-deps chromium
      - run: npm run rebuild:native
      - run: xvfb-run -a -s "-screen 0 1600x900x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            playwright-report/
            test-results/
